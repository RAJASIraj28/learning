<!DOCTYPE html>
<head>
    <title>Hospital Form</title>
  <style>
    body {
      background: lightblue;
     
    }

    .box {
      max-width: 600px;
      margin: 40px auto;
      background: white;
      padding: 30px;
      border-radius: 12px;
      ;
    }

    h1 {
      text-align: center;
      color: blue;
      margin-bottom: 20px;
    }
     .form{

    .buttons input[type="submit"] {
      background-color: blue;
      color: white;
    }

    .buttons input[type="reset"] {
      background-color: red;
      color: white;
    }

  </style>
</head>
<body>

  <div class="box">
    <h1>Hospital Admission Form</h1>

    <form action="rajasi-submit.html" method="post">

      <label>Date</label>
      <input type="date" name="date"><br><br>

      <label>Patient Name</label>
      <input type="text" name="name"><br><br>

      <label>Address</label>
      <input type="text" name="address"><br><br>

      <label>Gender</label><br><br>
      <input type="radio" name="gender" value="male"> Male
      <input type="radio" name="gender" value="female"> Female<br><br>

      <label>Marital Status</label><br><br>
      <input type="radio" name="marital_status" value="married">maried 
      <input type="radio" name="marital_status" value="unmarried">unmaried<br><br> 

      <label>Date of Birth</label><br>
      <input type="date" name="dob"><br><br>

      <label>Phone Number</label><br>
      <input type="tel" name="phone"><br><br>
S
      <label>select Department</label><br>
      <select name="department"><br><br>
        <option value="general">General Medicine</option>
        <option value="cardiology">Cardiology</option>
        <option value="orthopedics">Orthopedics</option>
        <option value="neurology">Neurology</option>
        <option value="pediatrics">Pediatrics</option>
      </select><br><br>

      <label>Preferred Doctor</label><br>
      <select name="doctor"><br><br>
        <option value="dr_sharma">Dr. Sharma</option>
        <option value="dr_verma">Dr. Verma</option>
        <option value="dr_patel">Dr. Patel</option>
        <option value="dr_reddy">Dr. Reddy</option>
        <option value="dr_singh">Dr. Singh</option>
      </select>

      <div class="buttons">
        <input type="submit" value="Submit">
        <input type="reset" value="Reset">
      </div>

    </form>
  </div>

</body>
</html>
