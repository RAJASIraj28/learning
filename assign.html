<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image and Iframe Example</title>
    <style>
        body {
            background-color: grey;
            text-align: center;

        }

        .image-box {
            width: 50%;
            padding: auto;
            border-radius: 1cm;
            text-align: center;
        }
    </style>
</head>

<body>
    <h1>Images and Iframe Demo</h1>


    <div class="image-box">
        <h2>College Logo</h2>
        <img src="https://i.ytimg.com/vi/LruTJyusVwg/oardefault.jpg" alt="G.E.C Bhojpur" width="250" height="250">
    </div>


    <div class="iframe-box">
        <h2>Wikipedia</h2>
        <iframe src="https://en.wikipedia.org/wiki/God" width="700px" height="500px" padding="auto" margin="20px">
        </iframe>

    </div>
</body>

</html>
